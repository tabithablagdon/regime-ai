[project]
name = "equity-ensemble"
version = "0.1.0"
description = "Multi-agent equity forecast ensemble (MVP): Technicals + Fundamentals/Sentiment specialists reconciled by a Meta-Agent."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "langgraph>=0.2",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "typer>=0.12",
    "httpx>=0.27",
    "asyncpg>=0.29",
    "pgvector>=0.3",
    "numpy>=1.26",
    "scipy>=1.13",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "voyageai>=0.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
]

[project.scripts]
forecast = "equity_ensemble.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["equity_ensemble"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
