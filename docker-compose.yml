services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: equity_ensemble
      POSTGRES_PASSWORD: equity_ensemble
      POSTGRES_DB: equity_ensemble
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U equity_ensemble"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
